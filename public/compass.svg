<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Ring with tick marks -->
  <circle cx="50" cy="50" r="48" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="45" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="50" cy="50" r="41" stroke="#2E86AB" stroke-width="1" stroke-dasharray="1 3"/>
  <circle cx="50" cy="50" r="32" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="50" r="16" stroke="#D4AF37" stroke-width="1" opacity="0.8"/>

  <!-- Secondary Points (NE, SE, SW, NW) -->
  <polygon points="50,50 46,26 50,15 54,26" fill="#F3C64F" opacity="0.75" transform="rotate(45 50 50)"/>
  <polygon points="50,50 46,26 50,15 50,50" fill="#D4AF37" opacity="0.9" transform="rotate(45 50 50)"/>
  
  <polygon points="50,50 46,26 50,15 54,26" fill="#F3C64F" opacity="0.75" transform="rotate(135 50 50)"/>
  <polygon points="50,50 46,26 50,15 50,50" fill="#D4AF37" opacity="0.9" transform="rotate(135 50 50)"/>

  <polygon points="50,50 46,26 50,15 54,26" fill="#F3C64F" opacity="0.75" transform="rotate(225 50 50)"/>
  <polygon points="50,50 46,26 50,15 50,50" fill="#D4AF37" opacity="0.9" transform="rotate(225 50 50)"/>

  <polygon points="50,50 46,26 50,15 54,26" fill="#F3C64F" opacity="0.75" transform="rotate(315 50 50)"/>
  <polygon points="50,50 46,26 50,15 50,50" fill="#D4AF37" opacity="0.9" transform="rotate(315 50 50)"/>

  <!-- Cardinal Points (N, E, S, W) -->
  <!-- North Point (Star of the North) -->
  <polygon points="50,50 44,22 50,4 50,50" fill="#F3C64F"/>
  <polygon points="50,50 56,22 50,4 50,50" fill="#D4AF37"/>

  <!-- East Point -->
  <polygon points="50,50 44,22 50,4 50,50" fill="#F3C64F" transform="rotate(90 50 50)"/>
  <polygon points="50,50 56,22 50,4 50,50" fill="#D4AF37" transform="rotate(90 50 50)"/>

  <!-- South Point -->
  <polygon points="50,50 44,22 50,4 50,50" fill="#F3C64F" transform="rotate(180 50 50)"/>
  <polygon points="50,50 56,22 50,4 50,50" fill="#D4AF37" transform="rotate(180 50 50)"/>

  <!-- West Point -->
  <polygon points="50,50 44,22 50,4 50,50" fill="#F3C64F" transform="rotate(270 50 50)"/>
  <polygon points="50,50 56,22 50,4 50,50" fill="#D4AF37" transform="rotate(270 50 50)"/>

  <!-- Center Pivot -->
  <circle cx="50" cy="50" r="7" fill="#0B192C" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="50" cy="50" r="3" fill="#D4AF37"/>
</svg>
